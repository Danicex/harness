<!-- Lightbox -->
<div id="lightbox" class="fixed inset-0 z-[65] bg-black/92 opacity-0 pointer-events-none transition duration-300 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lbClose" aria-label="Close" class="absolute top-6 right-6 text-white text-sm tracking-wider uppercase">Close ✕</button>
  <button id="lbPrev" aria-label="Previous photo" class="absolute left-3 md:left-8 top-1/2 -translate-y-1/2 grid place-items-center w-11 h-11 rounded-full border border-white/50 text-white transition hover:bg-white/10">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button id="lbNext" aria-label="Next photo" class="absolute right-3 md:right-8 top-1/2 -translate-y-1/2 grid place-items-center w-11 h-11 rounded-full border border-white/50 text-white transition hover:bg-white/10">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <figure class="max-w-5xl w-full">
    <img id="lbImage" src="" alt="" class="w-full max-h-[75vh] object-contain">
    <figcaption id="lbCaption" class="mt-4 text-center text-sm text-white/80"></figcaption>
  </figure>
</div>

<script>
  const items = [...document.querySelectorAll('.gallery-item')];
  const lb = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbCaption = document.getElementById('lbCaption');
  let idx = 0;
  function show(i) {
    idx = (i + items.length) % items.length;
    const it = items[idx];
    lbImage.src = it.dataset.full;
    lbImage.alt = it.dataset.caption;
    lbCaption.textContent = it.dataset.caption;
  }
  function open(i) { show(i); lb.classList.remove('opacity-0','pointer-events-none'); }
  function close() { lb.classList.add('opacity-0','pointer-events-none'); }
  items.forEach((it, i) => it.addEventListener('click', () => open(i)));
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', () => show(idx - 1));
  document.getElementById('lbNext').addEventListener('click', () => show(idx + 1));
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  document.addEventListener('keydown', (e) => {
    if (lb.classList.contains('opacity-0')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(idx - 1);
    if (e.key === 'ArrowRight') show(idx + 1);
  });
</script>
