<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking — Vista Suites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink: '#202631', mist: '#d9d9d9' },
    fontFamily: { display: ['"Poiret One"', '"Josefin Sans"', 'sans-serif'], body: ['"Red Hat Display"', 'system-ui', 'sans-serif'] }
  } } };
</script>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body class="bg-[#13171d] text-white">
<div id="site-header"></div>

<main>
  <!-- PAGE HERO -->
  <section class="relative h-[58vh] min-h-[400px] overflow-hidden flex items-end">
    <div class="absolute inset-x-0 top-[-15%] h-[130%]" data-parallax=".15">
      <img class="kb h-full w-full object-cover" alt="" data-seed="booking-hero" src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=2000&q=75">
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-ink/85 to-ink/40"></div>
    <div class="relative mx-auto w-full max-w-7xl px-6 pb-12">
      <h1 class="display leading-[.92] text-white" style="font-size:clamp(3rem,10vw,8rem)">
        <span class="rise"><span style="--d:.2s">Booking</span></span>
      </h1>
      <p class="mt-4 text-white/85 max-w-md" data-reveal="fade" style="--d:900ms">Pick your room, tell us your dates, and we'll hold it for you.</p>
    </div>
  </section>

  <!-- BOOKING FORM -->
  <section class="bg-[#13171d] border-b border-white/25">
    <div class="mx-auto max-w-4xl px-6 py-16 md:py-20">
      <h2 class="display mb-10 text-white" style="font-size:clamp(2rem,5.5vw,3.2rem)" data-reveal>Check availability</h2>
      <form id="bookingForm" class="grid gap-5 sm:grid-cols-2" data-stagger>
        <div class="sm:col-span-2 grid gap-5 sm:grid-cols-2">
          <label class="block">
            <span class="block text-xs uppercase tracking-wide text-white/70 mb-2">Full name</span>
            <input required name="name" type="text" placeholder="Jordan Blake" class="w-full bg-white/10 border border-white/25 px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:border-white">
          </label>
          <label class="block">
            <span class="block text-xs uppercase tracking-wide text-white/70 mb-2">Email</span>
            <input required name="email" type="email" placeholder="you@email.com" class="w-full bg-white/10 border border-white/25 px-4 py-3 text-white placeholder-white/40 focus:outline-none focus:border-white">
          </label>
        </div>
        <label class="block">
          <span class="block text-xs uppercase tracking-wide text-white/70 mb-2">Check-in</span>
          <input required name="checkin" type="date" class="w-full bg-white/10 border border-white/25 px-4 py-3 text-white focus:outline-none focus:border-white [color-scheme:dark]">
        </label>
        <label class="block">
          <span class="block text-xs uppercase tracking-wide text-white/70 mb-2">Check-out</span>
          <input required name="checkout" type="date" class="w-full bg-white/10 border border-white/25 px-4 py-3 text-white focus:outline-none focus:border-white [color-scheme:dark]">
        </label>
        <label class="block">
          <span class="block text-xs uppercase tracking-wide text-white/70 mb-2">Guests</span>
          <select name="guests" class="w-full bg-white/10 border border-white/25 px-4 py-3 text-white focus:outline-none focus:border-white">
            <option class="text-ink" value="1">1 guest</option>
            <option class="text-ink" value="2" selected>2 guests</option>
            <option class="text-ink" value="3">3 guests</option>
            <option class="text-ink" value="4">4 guests</option>
          </select>
        </label>
        <label class="block">
          <span class="block text-xs uppercase tracking-wide text-white/70 mb-2">Room</span>
          <select id="roomSelect" name="room" class="w-full bg-white/10 border border-white/25 px-4 py-3 text-white focus:outline-none focus:border-white">
            <option class="text-ink">Loading rooms…</option>
          </select>
        </label>
        <div class="sm:col-span-2 pt-2">
          <button type="submit" class="inline-flex items-center gap-3 bg-white text-ink px-7 py-4 text-xs font-bold uppercase tracking-wider transition hover:bg-white/85">
            Request booking
            <svg class="arrow w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
          </button>
          <p id="bookingStatus" class="mt-4 text-sm text-white/75" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>

  <!-- ROOMS (API with default fallback) -->
  <section class="bg-[#13171d]">
    <div class="mx-auto max-w-7xl px-6 py-20">
      <h2 class="display mb-4 text-white" style="font-size:clamp(2.6rem,8vw,6.5rem)" data-reveal>Rooms &amp; Suites</h2>
      <p id="roomStatus" class="mb-10 text-sm text-white/60" aria-live="polite">Loading rooms…</p>
      <div id="rooms" class="grid gap-x-6 gap-y-14 md:grid-cols-2 lg:grid-cols-3"></div>
    </div>
  </section>

  <!-- TESTIMONIALS -->
  <section class="bg-[#13171d] border-t border-white/25">
    <div class="mx-auto max-w-7xl px-6 py-24">
      <h2 class="display leading-[.95] mb-16 text-white" style="font-size:clamp(2.6rem,8vw,6.5rem)" data-reveal>What our<br>guests say</h2>
      <div class="grid gap-6 md:grid-cols-3" data-stagger>
        <figure class="border border-white/40 p-8 flex flex-col justify-between min-h-[230px] transition duration-500 hover:border-white hover:-translate-y-2">
          <blockquote class="leading-relaxed text-white/90">"I've stayed in a lot of business hotels. This is the first where I actually slept, and the view over the city didn't hurt."</blockquote>
          <figcaption class="mt-8 text-xs font-bold uppercase text-white">— Carly Ferris</figcaption>
        </figure>
        <figure class="border border-white/40 p-8 flex flex-col justify-between min-h-[230px] transition duration-500 hover:border-white hover:-translate-y-2">
          <blockquote class="leading-relaxed text-white/90">"Late arrival, early meeting. The concierge had my car booked and a coffee waiting before I asked."</blockquote>
          <figcaption class="mt-8 text-xs font-bold uppercase text-white">— Neil Tran</figcaption>
        </figure>
        <figure class="border border-white/40 p-8 flex flex-col justify-between min-h-[230px] transition duration-500 hover:border-white hover:-translate-y-2">
          <blockquote class="leading-relaxed text-white/90">"The Penthouse Suite made a two-night work trip feel like a holiday. We're already planning a return."</blockquote>
          <figcaption class="mt-8 text-xs font-bold uppercase text-white">— Jin Ae Soo</figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script>
/* ============================================================
   ROOMS: fetch from API → render. If the request fails, times
   out or returns nothing usable, render DEFAULT_ROOMS instead.
   Point ROOMS_API_URL at your backend, or test with ?api=URL
   Accepted shape: an array, or { rooms: [...] }, of objects with
   name|title, price|pricePerNight, image|imageUrl|thumbnail,
   maxGuests|guests|capacity, beds|bedConfig.
   ============================================================ */
const ROOMS_API_URL = new URLSearchParams(location.search).get('api') || 'https://api.example.com/v1/rooms';
const U = (id) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=900&q=75`;

const DEFAULT_ROOMS = [
  { name: 'Luxury Room',     price: 200, guests: 2, beds: '1 Queen or 2 Single Beds', image: U('1631049307264-da0ec9d70304') },
  { name: 'Deluxe Room',     price: 250, guests: 2, beds: '1 Queen or 2 Single Beds', image: U('1590490360182-c33d57733427') },
  { name: 'Studio Suite',    price: 300, guests: 2, beds: '1 Queen or 1 King Bed',    image: U('1611892440504-42a792e24d32') },
  { name: 'Executive Suite', price: 350, guests: 2, beds: '1 King Bed or 2 Single Beds', image: U('1582719478250-c89cae4dc85b') },
  { name: 'Premier Suite',   price: 450, guests: 4, beds: '2 Queen Beds',             image: U('1566665797739-1674de7a421a') },
  { name: 'Penthouse Suite', price: 500, guests: 4, beds: '2 King Beds',              image: U('1512918728675-ed5a9ecdebfd') },
];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bedIcon = '<svg class="w-7 h-5" viewBox="0 0 28 18" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="2" width="20" height="7" rx="1.5"/><path d="M1 16V9h26v7M1 13h26"/></svg>';
const arrow = '<svg class="arrow w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';

function roomCard(r, i) {
  const n = Math.min(4, Math.max(1, (String(r.beds).match(/\d+/g) || [1]).reduce((a, b) => a + +b, 0)));
  return `
  <article class="group" data-reveal style="--d:${(i % 3) * 120}ms">
    <button type="button" data-room="${esc(r.name)}" class="pick-room block w-full text-left border border-white/30 bg-white/5 transition duration-500 group-hover:-translate-y-2 group-hover:shadow-2xl group-hover:border-white">
      <div class="overflow-hidden aspect-[4/2.9]">
        <img src="${esc(r.image)}" data-seed="room-${i}" alt="${esc(r.name)}" loading="lazy" class="h-full w-full object-cover transition duration-[1200ms] group-hover:scale-110">
      </div>
      <div class="flex items-start justify-between gap-3 p-4 pb-0 text-white/80">
        <p class="text-[11px] leading-snug uppercase tracking-wide max-w-[62%]">Max ${esc(r.guests)} guests / ${esc(r.beds)}</p>
        <div class="flex gap-1 text-white/55">${bedIcon.repeat(n)}</div>
      </div>
      <h3 class="display text-4xl md:text-[2.6rem] leading-[.95] px-4 pt-3 pb-6 text-white">${esc(r.name)}</h3>
    </button>
    <div class="flex items-center justify-end gap-3 pt-4 text-xs font-bold uppercase tracking-wide text-white">
      From $${esc(r.price)}/night ${arrow}
    </div>
  </article>`;
}

function skeletons() {
  return Array.from({ length: 6 }, () => `
    <div><div class="shimmer aspect-[4/2.9]"></div><div class="shimmer mt-4 h-24"></div></div>`).join('');
}

function normalise(r, i) {
  const name = r.name || r.title || r.roomType;
  const price = Number(r.price ?? r.pricePerNight ?? r.rate);
  if (!name || !Number.isFinite(price)) return null;
  const fallback = DEFAULT_ROOMS[i % DEFAULT_ROOMS.length];
  return {
    name, price,
    guests: r.maxGuests ?? r.guests ?? r.capacity ?? 2,
    beds: r.beds || r.bedConfig || '1 Queen Bed',
    image: r.image || r.imageUrl || r.thumbnail || (Array.isArray(r.images) && r.images[0]) || fallback.image,
  };
}

async function fetchRooms() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch(ROOMS_API_URL, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const list = (Array.isArray(data) ? data : data.rooms || data.data || []).map(normalise).filter(Boolean);
    if (!list.length) throw new Error('No usable rooms in response');
    return { rooms: list, live: true };
  } catch (e) {
    console.warn('Rooms API unavailable, using default rooms:', e.message);
    return { rooms: DEFAULT_ROOMS, live: false };
  } finally { clearTimeout(timer); }
}

document.addEventListener('DOMContentLoaded', async function initRooms() {
  const grid = document.getElementById('rooms');
  const status = document.getElementById('roomStatus');
  const select = document.getElementById('roomSelect');
  grid.innerHTML = skeletons();
  const { rooms, live } = await fetchRooms();
  grid.innerHTML = rooms.map(roomCard).join('');
  status.textContent = live ? 'Live rates from our booking system.' : 'Showing our standard room rates.';
  select.innerHTML = rooms.map((r) => `<option class="text-ink" value="${r.name}">${r.name} — from $${r.price}/night</option>`).join('');
  window.Site && Site.reveal(grid);

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.pick-room');
    if (!btn) return;
    select.value = btn.dataset.room;
    document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
});

/* ============================================================
   BOOKING FORM: posts to BOOKING_API_URL. If it fails or isn't
   wired up, show a friendly confirmation message locally so the
   form still feels complete, and mention emailing the property.
   ============================================================ */
const BOOKING_API_URL = 'https://api.example.com/v1/bookings';
document.getElementById('bookingForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const status = document.getElementById('bookingStatus');
  const data = Object.fromEntries(new FormData(form).entries());
  status.textContent = 'Sending your request…';
  try {
    const res = await fetch(BOOKING_API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    status.textContent = `Thanks, ${data.name.split(' ')[0]} — your request for the ${data.room} has been sent. We'll confirm by email shortly.`;
    form.reset();
  } catch (err) {
    console.warn('Booking API unavailable:', err.message);
    status.textContent = `Thanks, ${data.name.split(' ')[0]} — we've noted your request for the ${data.room}. Our booking system is temporarily unreachable, so please also email hello@vistasuites.com or call +1 (234) 567-890 to confirm.`;
  }
});
</script>
</body>
</html>
